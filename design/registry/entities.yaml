# 2026-11-15 (lane SYS-16, the progression sync — report §4c): the two cross-boundary laws the
# growth layer publishes. Both are TRUE LAWS, not knobs (the GDD's own class column).
  - name: attack_seam
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
      - design/gdd/health-damage.md
    kind: formula
    variables:
      - L (the level; 1–20; the MVP cap 5 — LEVEL_CAP_MVP)
      - a (atk_points; 0–4 — POINT_BUDGET_CAP)
      - PLAYER_ATK_BASE (100 — SYS-07's fixed identity base)
      - ATK_PER_POINT (8 — SYS-07's ladder index step)
      - VS_ATTACK_STEP (6 — SYS-16's VS step)
      - LEVEL_CAP_MVP (5 — SYS-07's)
    output_range: [100, 222]
    expression: "attack(L, a) = PLAYER_ATK_BASE + ATK_PER_POINT × a + VS_ATTACK_STEP × max(0, L − LEVEL_CAP_MVP)"
    notes: "F-PRG-01 — **SYS-07's OQ#20 answered**. At L5 it is exactly SYS-07's points law
      (100 + 8a); from L6 the level adds a flat +6, so the stat never decreases on any
      level-up. It supersedes the frozen VS candidate `100 + 6×(L−1)`, which gives 130 at L6 —
      below the 132 points cap, i.e. a player who spent four points would LOSE 2 attack. The
      OQ asked for monotonicity in the stat and in the dealt value; this law gives both (the
      dealt side is `damage_ladder_mvp`'s above-132 extension). Fixtures: L1/a0 100 · L5/a4
      132 · L6/a0 106 · L6/a4 138 · L6/a2 122 · L20/a0 190 · L20/a4 222; ∂/∂L = 6 above the
      cap, ∂/∂a = 8, so the L5→L6 step is +6 for every split. **SYS-07's F-HD-14 attack
      candidate and its 'up to L20 (214)' ceiling are superseded by this law** — the rider
      rides SYS-07's next doc touch (SYS-07's frozen text is NOT edited by this sync)."
    added: 2026-11-15
    revised: ""

  - name: gear_budget
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    kind: formula
    variables:
      - chain_nogear (F-PRG-03's dealt law — dealt(ATK1) + dealt(ATK2); NEVER step()'s clamp, which saturates at row 4 and under-reports every L6+ build)
      - chain_loadout (chain_nogear + 2 × aggregate.damage_bonus)
      - chain_points (chain_loadout − chain_nogear) and chain% (chain_points ÷ chain_nogear)
      - Δhp (aggregate.hp_max_delta) and pool% (Δhp ÷ hp_max(L, h))
      - GEAR_BAND_PCT (0.10)
      - MODULE_HP_PER_CHAIN_POINT (3)
      - WINDOW_EXCEPTION_ENABLED / WINDOW_EXCEPTION_CHAIN_POINTS (the exception's switch and bound)
    output_range: [0, 1]
    expression: "pass ⇔ (c) no pool stacking (at most one frame payload contributes) ∧ [ ((a) pool% ≤ GEAR_BAND_PCT ∧ ((b1) chain% ≤ GEAR_BAND_PCT ∨ (b2) Δhp ≤ −MODULE_HP_PER_CHAIN_POINT × chain_points)) ∨ ((d) the loadout is exactly the enumerated exception — Regulator-000 in the drive slot — with WINDOW_EXCEPTION_ENABLED ∧ chain_points ≤ WINDOW_EXCEPTION_CHAIN_POINTS) ]"
    notes: "F-PRG-06 — the two-axis guardrail (the Quantisation Law's *paid* answer, TR-PRG-013/014).
      **How to read the predicate:** (a)∧(b) is the ordinary loadout's test — (b1) is the free
      band and (b2) is the payment, and (b) passes if EITHER holds; (c) applies to every loadout
      (no pool stacking is structural); (d) is the SEPARATE admission clause for the one
      enumerated exception, which is why Regulator-000 alone (chain 8 vs 6, Δhp 0) is FALSE under
      (a)∧(b) and TRUE only through (d) — an implementer must not use (a)∧(b) as the equip check
      or it rejects a module the catalogue allows. The grouping is explicit because `∧` binds
      tighter than `∨`.
      The six-loadout table at L1 (chain 6, pool 20): ∅ chain 6/pool 20 pass (a) · Governor-207
      6/22 pass (a, 10% ≤ 10%) · Coupler-034 8/12 pass (b, −8 ≤ −6) · Coupler+Governor 8/14
      pass (b, AT the floor) · Regulator-000 8/20 and Regulator+Governor 8/22 are the
      **exception** (d). **Level-invariance:** the exchange is point-for-point, so it holds
      unchanged at L5 all-ATK and at L5 all-HP. **The exception** is exactly {Regulator-000},
      bounded at `WINDOW_EXCEPTION_CHAIN_POINTS` 2 (+33.3% at row 0, decaying to +20% at row 4),
      and closable by ONE coded 'broken promise' at the Gate-2 probe (AC-PRG-34) — closing it
      turns the module into the paid payload {damage_bonus +1, hp_max −6}, which may not be
      equipped alongside a frame (its cost becomes unpayable with term (b)). The 60 s integral
      is blind to the pool (779 vs 584), which is WHY the guardrail is a pair of axes and not
      one number. Weapons are untouched: TR-HD-034/F-HD-13 keep the weapon set's ±10% ceiling."
    added: 2026-11-15
    revised: ""

