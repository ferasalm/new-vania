    notes: "The persistence split: SYS-01's Controls section persists to SYS-01's device-local `controls.cfg` (its frozen law — the HUD invokes, never writes the file); the Feedback/Audio/Text sections persist here (the single-boundary law; cross-device-critical on purpose — a photosensitive player's REDUCED_FLASH follows the save). **The bump-order law (OQ-HUD-3):** bump numbers are assigned at registration by landing order, never by plan — SYS-16's `progression` holds `MIGRATIONS[2]` (v2→v3, recorded); if it has landed, `settings` takes `MIGRATIONS[3]` (v3→v4) and SYS-17's planned v3→v4 inventory migration (OQ-PRG-5) renumbers +1; if it has not, the two compete and the loser renumbers — every renumber is a recorded rider naming its counterparty (SYS-16's owner; SYS-17's owner), never a silent renumber."
