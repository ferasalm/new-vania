# 2026-11-15 (lane SYS-16, the progression sync — report §4b): SYS-16's own constants. All
# designer-only at MVP (no player-facing knob); every one is validated at config load and
# re-validated on a live edit (V-PRG: clamp + rate-limited telemetry in production, assert in dev).
  - name: vs_attack_step
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 6
    unit: attack per level from L6
    notes: "F-PRG-01's VS step (safe range 4–8): `+6 attack` per level above `LEVEL_CAP_MVP`,
      flat for every point split. It supersedes the frozen VS candidate `100 + 6×(L−1)`,
      which gives 130 at L6 — *below* the 132 points cap and therefore a decrease. VS-only in
      practice (the MVP cap is 5); the value is registered now so the seam's arithmetic has
      one home."
    added: 2026-11-15
    revised: ""
  - name: point_budget_cap
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 4
    unit: points (fixed at MVP)
    notes: "F-PRG-08's identity: `atk_points + hp_points + banked_points = min(level − 1,
      POINT_BUDGET_CAP)`. The four points are the whole game's allocation budget; levels 6–20
      grow the sheet through the level curve, never through more points. Fixed at 4: the
      level-up rule grants one point per level to L5 only, so a cap above 4 is a non-fixpoint
      and fails the boot."
    added: 2026-11-15
    revised: ""
  - name: module_damage_bonus
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 1
    unit: damage (the drive payload; 2 chain points)
    notes: "The drive axis's only value (fixed identity): one drive contributes
      `damage_bonus` 1 = two chain points (F-PRG-06's `chain_loadout = chain_nogear + 2 ×
      damage_bonus`). The value crosses to SYS-07 inside `gear_aggregate` and lands in
      `StatBlock.damage_bonus`, which F-HD-02 copies into the `AttackContext` at the contact
      (the module stage, branch 2 only). `damage_bonus` never sums — the loadout's value is
      the maximum over equipped drives (TR-PRG-015's max-law)."
    added: 2026-11-15
    revised: ""
  - name: module_hp_per_chain_point
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 3
    unit: hp per chain point
    notes: "F-PRG-06(b)'s exchange (safe range 2–4): beyond the free band on the damage axis a
      loadout must pay 3 HP per chain point (`chain% > 10% ⇒ Δhp ≤ −3 × chain_points`). The
      Coupler's 8-HP premium exists so the designed pair (Coupler + Governor-207) pays exactly
      6 — the floor (TR-PRG-019). **The range is a config envelope, not a validity proof:** it is
      jointly constrained with `MODULE_COUPLER_HP_COST` (the pair's floor is
      `3 × chain_points` = 6) and with `MODULE_FRAME_HP_BONUS` (the free band is
      `GEAR_BAND_PCT × hp_max`), so a value inside a range can still fail F-PRG-06 for a given
      loadout — the guardrail, not the range, is the validity law, and V-PRG validates the pair
      at config load and on every live edit."
    added: 2026-11-15
    revised: ""
  - name: module_coupler_hp_cost
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 8
    unit: hp
    notes: "Coupler-034's payment (safe range 6–10; TR-PRG-019). Alone it is the glass build
      (pool 20 → 12, OQ-PRG-1's playtest question); paired with Governor-207 it lands exactly
      on the exchange floor (20 → 14, Δhp −6 ≤ −6). Not the derived
      `MODULE_DAMAGE_HP_COST` (6 = 3 × 2 × 1) — the premium over it is deliberate. **The range's
      ends are recorded consequences, not supported loadouts:** at 6 the pair pays only 4 against
      the required 6 (it overshoots the floor by 2, TR-PRG-019) and at 10 the pair over-pays
      (Δhp −8). A value in the range is a legal config; whether a given loadout passes is
      F-PRG-06's call, validated by V-PRG at load and on live edit."
    added: 2026-11-15
    revised: ""
  - name: module_frame_hp_bonus
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 2
    unit: hp
    notes: "Governor-207's payload (safe range 2–4): the frame axis's step. At the 20-HP
      baseline +2 is exactly `GEAR_BAND_PCT`'s 10% free band — the largest value that passes
      term (a) alone (4 would be +20%, over the band). The frame is the defensive build
      because `defense` is retired from gear (TR-PRG-016). **The upper end of the range is a
      recorded consequence, not a supported loadout:** 4 fails term (a) at the 20-HP pool (the
      band is a ratio, so a larger pool re-admits it) — the guardrail is the validity law and
      V-PRG validates it at config load and on every live edit."
    added: 2026-11-15
    revised: ""
  - name: gear_band_pct
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 0.10
    unit: ratio (pool axis)
    notes: "F-PRG-06(a)'s free band (safe range 0.05–0.15): a loadout may gain up to 10% on
      the pool axis free. The ratio is the bound, so it scales with the pool. It is the one
      place the game's ±10% promise is expressible — one chain point is +16.7% at the
      baseline, which is why the damage axis is *paid* rather than bounded (TR-PRG-013).
      **Joint constraint:** the band is what makes `MODULE_FRAME_HP_BONUS` 2 legal at a 20-HP
      pool and 4 illegal — the two knobs are read together, never independently, and V-PRG
      validates the pair at config load and on every live edit."
    added: 2026-11-15
    revised: ""
  - name: progression_schema_version
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
      - design/gdd/save-serialization.md
    value: 3
    unit: schema version
    notes: "F-PRG-10 / TR-PRG-025: the `progression` namespace is the **v2→v3** bump
      (`MIGRATIONS[2]`, `CURRENT_SCHEMA_VERSION` 2 → 3 — SYS-03's schema facts, registered
      through SYS-03's own change path at the implementation story). SYS-15's `cache` took
      v1→v2; this is the next step, **not** the `v1→v2` the index's OQ-SAV-11 clause once
      claimed. A v2 payload carrying `progression` is `REFUSE_UNKNOWN_KEY`."
    added: 2026-11-15
    revised: ""
  - name: pacing_pass_yield_min
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 30
    unit: training data per pass
    notes: "F-PRG-04's floor (safe range 30–40), derived: `ceil(TRAINING_DATA_L4 ÷
      PACING_PASSES_L4_MAX)` = `ceil(90 ÷ 3)` = 30, asserted at boot. The slice's derived yield
      is exactly 30 (2 Husks + 1 Husk + 1 Spitter + 1 Warden = 6 + 10 + 14), so a spawn-list or
      tier change that drops it below the floor flags the pass count it would take. The
      placement is SYS-02's room data and the tiers are SYS-13's; this is the budget those
      owners satisfy."
    added: 2026-11-15
    revised: ""
  - name: pacing_passes_l4_max
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 3
    unit: passes
    notes: "The authored bar's first landmark (safe range 2–4): L4 by the third pass
      (`passes_to(L4) = ceil(90 ÷ 30) = 3`). It is the floor's own derivation input, so the two
      knobs move together (a 4th pass would need a yield of 23)."
    added: 2026-11-15
    revised: ""
  - name: pacing_passes_l5_max
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
    value: 4
    unit: passes (including the boss's)
    notes: "The authored bar's second landmark (safe range 3–5): L5 at the fourth pass's boss
      (3 passes = 90, + the fourth pass 30 = 120, + `xp_boss` 40 = 160 ≥ 140; the 20 excess is
      discarded at the cap). Pure farm alone needs five passes — the boss is the fifth rung of
