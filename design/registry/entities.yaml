    values: "ChassisModule {module_id, display_name, slot ∈ {drive, frame}, payload {damage_bonus?, hp_max?}, lore_lines: 2, source_room} — deterministic, unique, no RNG, no affixes, no rarity. The payload set is CLOSED: `attack`, `defense` and every behavioural field are rejected at the boot (TR-PRG-012; `defense` is retired, TR-PRG-016). The three MVP entries: **Coupler-034** (drive, `damage_bonus` +1, `hp_max` −8; a fixed pre-flip pickup) · **Governor-207** (frame, `hp_max` +2; a fixed pre-flip pickup) · **Regulator-000** (drive, `damage_bonus` +1; the Warden's own regulator — a guaranteed placed `TAKE` in the Cold Corridor wing beside memory M4, behind the post-flip partition, the guardrail's ONE enumerated exception, TR-PRG-017)."
    notes: "A drive may carry a negative `hp_max` (the payment of the guardrail's term (b)) but never a positive one — a positive pool payload is a frame's job; a frame carries no `damage_bonus` (TR-PRG-015's typing). The lore is exactly two lines in the print voice, never a stat line (SYS-28's language law). A pickup adds the id to `owned` and never auto-equips; equipping is a player act on SYS-24's pause surface (TR-PRG-020). The catalogue's *entities* are SYS-17's; the payloads and the loadout law are SYS-16's — the split is TR-PRG-027's, and at VS `owned`/`equipped` move to SYS-17's namespace in a v3→v4 migration (OQ-PRG-5)."
    added: 2026-11-15
    revised: ""

  - name: gear_aggregate
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
      - design/gdd/health-damage.md
    kind: published_contract
    published_by: SYS-16 (F-PRG-05, TR-PRG-026) — the aggregation, the max-law, the revision
    consumed_by: "SYS-07 (folding it into the `StatBlock` at the equip — TR-HD-006's equipment-change `StatRevision` cause, one revision per change; `damage_bonus` reaches `AttackContext` through F-HD-02's branch-2 module stage)"
    values: "GearAggregate {damage_bonus, hp_max_delta, attack_delta, defense_delta, revision} — `damage_bonus = max({m.damage_bonus : m equipped ∧ m.slot = drive} ∪ {0})` (never a sum: a VS second drive slot cannot silently stack); **`hp_max_delta = Σ {m.hp_max : m equipped} over BOTH slots** — the frame contributes its gain and a drive contributes its cost, so the Coupler's −8 lands in the aggregate (without it the exchange would be unpayable and the budget table would disagree with the formula); `attack_delta` 0 and `defense_delta` 0 at MVP (the lever set; they exist so a VS module needs no new schema); `revision = revision + 1` on every change. Identity (∅): {0, 0, 0, 0}."
    notes: "The loadout is the unit the player fields, so every gear law is evaluated on the loadout, never on a module in isolation (TR-PRG-014). `hp_max_effective = hp_max(L, h) + aggregate.hp_max_delta`, clamped ≥ 1; a negative delta CLAMPS the current HP at the swap (the trade's cost, not a bug — a Coupler fitted at 20/20 leaves the body at 12/12), while a point's +2 HEALS (the asymmetry is a SYS-07 input — rider (e)). Worked examples: Governor-207 {0, +2, 0, 0} · Coupler-034 {1, −8, 0, 0} · Coupler + Governor {1, −6, 0, 0} · Regulator-000 {1, 0, 0, 0} · Regulator + Governor {1, +2, 0, 0}."
    added: 2026-11-15
    revised: ""

  - name: progression_read
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
      - design/gdd/health-damage.md
      - design/gdd/cache-stations-death.md
      - design/gdd/hud.md
    kind: published_contract
    published_by: SYS-16 (TR-PRG-026) — the read-only publication; no writer field
    consumed_by: "SYS-24 (the three-value pause readout, the two loadout rows, the dormant Dash socket) · SYS-07 (the spend's ack: one `StatRevision` per spend and per equip) · SYS-15 (the preview's values on the frozen spend rows) · SYS-17 (the VS inventory's gear state)"
    values: "ProgressionRead {atk_points, hp_points, banked_points, atk_pair {atk1, atk2}, grants, owned, equipped {drive, frame}, aggregate} — **`atk_pair` is the printed EFFECTIVE pair**: the ladder row's ATK1/ATK2 plus the loadout's `damage_bonus` (with the Coupler equipped it prints `ATK 3/5`), so SYS-24 renders a number it does not re-derive and the printed number equals the dealt one by construction. It carries **no `level` and no `training_data`** — those are SYS-07's `HealthRead` and are not re-owned. `banked_points` is an alias, asserted equal to SYS-07's `HealthRead.training_points` at every publication (a divergence is refused with telemetry, never silently reconciled)."
    notes: "The point's transport is the spend's ack: SYS-15's commit → SYS-16 writes the counter → SYS-07 reads `ProgressionRead` and applies exactly one `StatRevision`. The aggregate is computed on a change and cached (TR-PRG-003: the layer has no tick); the read is a copy. ATK never prints the raw 100–132 resolver scale — that is the designer's ruler, not player copy — and `DEF` is omitted while it has no source (a dead value on a readout is a lie about a choice the player does not have, TR-PRG-011)."
    added: 2026-11-15
    revised: ""

  - name: grant_event
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
      - design/gdd/movement.md
      - design/gdd/input-control-mapping.md
      - design/gdd/juice-feedback.md
      - design/gdd/hud.md   # the socket's render + the persisted-grant init
    kind: published_contract
    published_by: SYS-16 (TR-PRG-021/022, F-PRG-09) — the set, the strict order, the latch, the persistence
    consumed_by: "SYS-06 (the behaviour-level gates on Jump: Wall Jump, Double Jump — TR-INP-057) · SYS-01 (Dash's action-registry flip — TR-INP-003) · SYS-24 (the socket's active state) · SYS-29 (the grant cue — one chime-class edge + one print row, no haptic, no flash, TR-JCE-021)"
    values: "GrantEvent {grant ∈ {DASH, WALL_JUMP, DOUBLE_JUMP, STINGER}, source, tick} — **once per grant, latched**: a repeat publishes nothing and changes nothing (F-PRG-09's idempotence); persisted in the `progression` namespace. Order law: `WALL_JUMP ∈ grants ⇒ DASH ∈ grants`; `DOUBLE_JUMP ∈ grants ⇒ WALL_JUMP ∈ grants`; `STINGER` is off-ladder and never satisfies a rung (a violation is refused at boot, naming the missing rung). **The late-consumer law: a consumer that starts AFTER the grant reads the persisted set at its init and restore and applies each recorded grant without a new `GrantEvent`** — the latch blocks *re-publication*, not *re-application from stored state*."
    notes: "MVP posture: **zero grants** — the frozen MVP definition says Dash stays locked (RJ-1 stands) and no wall-jump/double-jump content ships in the six rooms; the ladder's content at MVP is the anticipation design (the dormant Dash socket: hidden → dimmed-after-tease with the lock glyph → active; SYS-01's `DORMANT_DIM_AFTER_TEASE`, SYS-24's render), which never errors when pressed. The unlock moments are authored as data, not runtime: Dash → the VS slice's first-errand traversal gate · Wall Jump → Full-Vision errand 2's tagged-wall shaft · Double Jump → the Leap-Stone, errand 3. The no-softlock law (TR-PRG-024) passes vacuously at MVP and the build audit reports the vacuous pass explicitly — a silent skip is forbidden. A grant never fires from a load, a level-up or a region entry unless the slice's own trigger says so."
    added: 2026-11-15
    revised: ""

  - name: progression_namespace
    status: active
    source: design/gdd/progression.md
    referenced_by:
      - design/gdd/progression.md
      - design/gdd/save-serialization.md
    kind: published_contract
    published_by: SYS-16 (TR-PRG-025, F-PRG-10) — the shape, the writer, the carry, the conservative default; the mechanism is SYS-03's (TR-SAV-004)
    consumed_by: "SYS-03 (the **v2→v3** bump registration: `MIGRATIONS[2]` + `CURRENT_SCHEMA_VERSION` 2→3 at the namespace's implementation story — the OQ-M1 rider pattern, mirroring SYS-15's OQ-CSD-9, including the same obligation to reconcile SYS-03's stale 'zero registered migrations at MVP' posture sentence at that touch) · SYS-05 (SYS-16's carry-complete acknowledgment is a named input to `load_complete`) · SYS-17 (the VS v3→v4 migration that moves `owned`/`equipped` to the `inventory` namespace — OQ-PRG-5)"
    values: "progression: {level, training_data, atk_points, hp_points, grants, owned, equipped: {drive, frame}} — the conservative default is the identity `{1, 0, 0, 0, [], [], {null, null}}`; **no floats**; `banked_points` is DERIVED from SYS-07's `training_points`, never stored. SYS-16 is the namespace's ONLY writer: it snapshots SYS-07's `level`/`training_data` on the save request and never competes with the runtime source. **The carry law:** the namespace is live-carried across the reconstruct inside the restore window, read-gated (TR-CSD-012's pattern consumed verbatim) — a level earned after the last save is never rolled back (TR-CSD-013's no-XP-loss law); the saved value seeds only a fresh session load. A v2 payload carrying `progression` is `REFUSE_UNKNOWN_KEY`; an absent namespace or key at v3 reads its default."
    notes: "**The load-time validation (the law for a catalogue that moved under a save):** LOAD validates every equipped id against the catalogue and the loadout against the guardrail, and **a slot or `owned` entry whose payload cannot be validated is cleared (the slot to `null`, the id from `owned`) with exactly ONE report naming it — the load itself never fails for gear.** That is the defined outcome for the two instabilities CodeRabbit found at review: a save from a build that shipped a removed module, and `owned` ids with no payload. **The joint case — a valid-payload pair that fails the guardrail together** (a save made while the exception was open restores Regulator-000 + Governor-207 into a build where it is closed: both ids valid, the pair unpayable at `Δhp` −4 against the required −6, TR-PRG-017/F-PRG-07): LOAD repairs it by the same law, not a second one — it clears **the slot whose removal restores validity, the drive first where either would do** (the damage payload is the one that must pay under term (b), and clearing the frame cannot fix a payment shortfall), reports the cleared id once, and **never weakens the guardrail to admit the pair**. The bump is the named gate: without it progression state is session-only, so it cannot be silently dropped."
    added: 2026-11-15
    revised: ""

