# 2026-11-15 (lane SYS-24, the HUD sync — report §A2): the HUD layer's published contracts.
# The three entries are the caps' law, the presentation settings' persistence, and the
# region-registration protocol. Source: design/gdd/hud.md (lands with PR #86, after this
# sync by review-queue §7 rule 4 — the documented pending-path pattern).
  - name: hud_caps_contract
    status: active
    source: design/gdd/hud.md
    referenced_by:
      - design/gdd/hud.md
      - design/gdd/camera-framing.md
    kind: published_contract
    published_by: SYS-24 (TR-HUD-001..004, F-HUD-01/02/04) — the thumb-coverage caps' law
    consumed_by: "SYS-32 (TR-CAM-012's authored floor inset references `THUMB_BAND_CEILING_ART_PX` 24 — the arena's playable floor insets above it; the reveal's floor cannot inset, the collapse is the designed acceptance)"
    values: "The caps law: the caps derive only from the current tick's 9-field publication (never cached, never world position, never a retained read); the occlusion predicate `occluded(v) = on_screen ∧ intersect(v_screen_rect, rendered_center ± guard)` with `rendered_center = player_screen_px − shake_offset_px` (the camera composes the offset onto itself — the world shifts the opposite sign); the guard halves derive at boot from SYS-06's extent constants + `CAPS_GUARD_MARGIN_PX` 4 (a boot-time constant read, never a per-tick edge); `low_profile(v) = (hold_fixed ∧ bottom_anchored(v)) ∨ occluded(v)`; the collapse form = the ≤ 24-art-px affordance strip at `CAPS_COLLAPSE_ALPHA` 0.5 with the hit rect byte-identical (no re-registration); the hold anchor rule (per-tick during the ≤ 12 px/tick approach; one solve at the settle detection — eps 0.5 art px × 6 ticks; the 600-tick failsafe adopts the protective posture + the collapse); the protective posture on `on_screen = false` (legitimate or the camera's lost-body default); the `bounds_generation` adopt re-derives same tick; `authority` is never read."
    notes: "SYS-32's sole-channel law honored (the position is per-tick from the publication; the guard's size is a boot-calibrated constant, not a state read). The hysteresis (`CAPS_HYST_PX` 4 × `CAPS_HYST_TICKS` 6) binds the occlusion trigger only; the hold trigger's exit is one-tick on release."
    added: 2026-11-15
    revised: ""

