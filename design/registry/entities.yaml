# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: punish_window
    status: active
    source: design/gdd/enemy-ai-telegraphs.md
    referenced_by:
      - design/gdd/enemy-ai-telegraphs.md
      - design/gdd/health-damage.md
    variables:
      - chop_active_ms
      - chop_recovery_ms
      - jab_telegraph_ms
      - stagger_ms (the player's lose-branch stagger — SYS-08's STAGGER_MS 500; not the enemy's ENEMY_STAGGER_MS 800)
      - atk1_startup_ms
      - physics_tps
    output_range: [0, 30]
    expression: "lose L = contact + startup (F-CMB-03's clash_tick = projected_active_start);
      the chop's tail (active 7 + recovery 8 = 15 ticks at 60 tps) frees the
      Warden; the second breath's telegraph 15 ticks runs from the first free
      tick; the land = first_free + 15 = L + 24 ticks at 60 tps; the bound is
      the player's stagger [L, L + stagger_ticks - 1]"
    notes: "SYS-13's F-ENM-03, consumed by SYS-07's F-HD-12 (the lose-branch
      follow-up economics). At 60 tps the land is stagger-elapsed exactly 24
      ticks = 400.0 ms, inside the 500 ms stagger (margin 5); the read lead
      400 ms >= 250 (SYS-13's telegraph floor); the total 400 + 1200 =
      1600.0 ms in F-HD-12's [1450, 1700]. JOINT BOUND (V-ENM-17): the
      inside-the-stagger guarantee is validated in converted ticks at the
      configured rate — stagger_ticks >= chop_active_ticks +
      chop_recovery_ticks + jab_telegraph_ticks - atk1_startup_ticks + 1
      (every phase converting by F-ENM-01); at 60 tps this is
      STAGGER_MS >= 401 ms (validated at registration against SYS-08's knob;
      Combat's permitted range minimum 350 fails the boot with the punish
      rule on - the land would fall outside); 401 ms is the 60-tps example,
      not a rate-independent bound. RATE LAW: the ms window (400.0 ms) is the promise — at
      any other rate every phase re-derives by the never-stingy ceil
      (F-ENM-01), the output_range is the stagger-tick bound
      (stagger_ticks = ceil(stagger_ms x tps / 1000)), and the design
      guarantee (the land inside the stagger, the lead >= 250 ms) holds in
      ms at every rate. The lose cause is the heavy chop (the roster's one
      clashable power-2 strike); the crouch attack never clashes it (the
      HIGH band whiffs the crouched attacker), so the losing branch is
      unique and the fixture is exact."
    added: 2026-11-13
    revised: "2026-11-13 (CodeRabbit minors: the stagger bound is the player's STAGGER_MS, not ENEMY_STAGGER_MS; the rate law stated — the ms window is the contract, the ticks derive; the joint bound V-ENM-17 added — STAGGER_MS >= 401 ms)"

  - name: ms_to_ticks
    status: active
    source: design/gdd/input-control-mapping.md
    referenced_by:
      - design/gdd/input-control-mapping.md
      - design/gdd/juice-feedback.md
    variables:
      - window_ms
      - physics_tps
    output_range: [1, 5000]
    expression: "window_ticks = ceil(window_ms * physics_tps / 1000)"
    notes: "Never-stingy law: effective duration always >= window_ms (ceil).
      140ms@60 -> 9 ticks (150ms effective). Rate-scaling: ms is the contract,
      ticks derived; re-baseline ages through ms on rate change. GDD F-01.
      SYS-29's freeze conversion (F-JCE-01) is this family applied to the
      physics rate with max(1, ceil) and accumulated-elapsed re-baselining."
    added: 2026-11-11
    revised: "2026-11-13 (SYS-29 references the family; F-JCE-01 noted)"
  - name: freeze_ticks
    status: active
    source: design/gdd/juice-feedback.md
    referenced_by:
      - design/gdd/juice-feedback.md
      - design/gdd/movement.md
      - design/gdd/combat.md
    variables:
      - duration_ms
      - physics_tps
    output_range: [1, 65535]
    expression: "freeze_ticks = max(1, ceil(duration_ms * physics_tps / 1000))"
    notes: "The freeze conversion (SYS-29 F-JCE-01): ms is the contract,
      ticks derived on the physics rate (logic_tick is the counter being
      stopped). Pending sources re-baseline from the accumulated-elapsed
      record (duration_ms, elapsed_ms, current_tps) on a rate change.
      Consumers: SYS-01 (the clock law), SYS-06/SYS-08 (the freeze
      integration)."
    added: 2026-11-13
    revised: ""

